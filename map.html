<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แผนที่และการเดินทาง - วิทยาลัยเทคนิคนางรอง</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        maroon: { 700: '#800000' },
                        gold: { 500: '#f59e0b' }
                    }
                }
            }
        }
    </script>
    <style>body { font-family: 'Prompt', sans-serif; background-color: #f8fafc; }</style>
</head>
<body class="flex flex-col min-h-screen">

    <header class="bg-maroon-700 text-white shadow-lg sticky top-0 z-50 border-b-4 border-gold-500">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c3/Vocational_Education_Commission_Thailand_Logo.svg/1200px-Vocational_Education_Commission_Thailand_Logo.svg.png" class="w-12 h-12">
                <span class="text-xl font-bold">วิทยาลัยเทคนิคนางรอง</span>
            </div>
            <a href="index.html" class="inline-flex items-center px-4 py-2 bg-gold-500 hover:bg-gold-600 text-gray-900 font-semibold rounded-lg transition-colors text-sm shadow">
                <i class="fa-solid fa-house mr-2"></i> กลับหน้าหลัก
            </a>
        </div>
    </header>

    <main class="flex-grow container mx-auto px-4 py-8 max-w-5xl">
        <div class="bg-white rounded-2xl shadow-md p-6 md:p-8">
            <h2 class="text-2xl font-bold text-maroon-700 mb-6 flex items-center border-b pb-4">
                <i class="fa-solid fa-map-location-dot text-gold-500 mr-3"></i> 2. แผนที่และการนำทางในการเดินทาง
            </h2>

            <!-- รูปแผนผังหลัก -->
            <div class="mb-8">
                <h3 class="text-lg font-semibold text-gray-800 mb-3"><i class="fa-solid fa-sitemap text-maroon-700 mr-2"></i>แผนผังอาคารสถานที่ภายในวิทยาลัย</h3>
                <div class="rounded-xl overflow-hidden border border-gray-200 shadow-md">
                    <!-- แก้ไข URL รูปหลักตรง src="แผนผัง.jpg" -->
                    <img src="แผนผัง.jpg" alt="แผนผังวิทยาลัย" class="w-full h-auto cursor-pointer hover:opacity-95 transition-opacity" onclick="openModal(this.src)">
                </div>
            </div>

            <!-- รูปภาพเพิ่มเติม 2 รูป -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
                <div>
                    <h4 class="text-sm font-semibold text-gray-700 mb-2">ภาพบริเวณทางเข้าวิทยาลัย</h4>
                    <div class="rounded-xl overflow-hidden border border-gray-200 shadow">
                        <img src="photo/แผนผัง.jpg" alt="ภาพทางเข้า" class="w-full h-48 object-cover cursor-pointer hover:opacity-90 transition-opacity" onclick="openModal(this.src)" onerror="this.src='https://via.placeholder.com/600x400?text=ภาพทางเข้าวิทยาลัย'">
                    </div>
                </div>
                <div>
                    <h4 class="text-sm font-semibold text-gray-700 mb-2">ภาพลานจอดรถและจุดสังเกต</h4>
                    <div class="rounded-xl overflow-hidden border border-gray-200 shadow">
                        <img src="photo/รร รถ.jpg" alt="ภาพลานจอดรถ" class="w-full h-48 object-cover cursor-pointer hover:opacity-90 transition-opacity" onclick="openModal(this.src)" onerror="this.src='https://via.placeholder.com/600x400?text=ภาพจุดสังเกตการเดินทาง'">
                    </div>
                </div>
            </div>

            <!-- Google Maps -->
            <div class="mb-8">
                <h3 class="text-lg font-semibold text-gray-800 mb-3"><i class="fa-solid fa-location-pin text-maroon-700 mr-2"></i>พิกัด Google Maps</h3>
                <div class="w-full h-80 rounded-xl overflow-hidden shadow-inner border border-gray-300">
                    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3858.455243179261!2d102.7667!3d14.8833!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3119f4d2572a1cd9%3A0x6a29e46a74b1cb6a!2z4Lin4Li04LiX4Lii4Liy4Lil4Lix4Lii4LmA4LiX4LiE4LiZ4Li04LiE4LiZ4Liy4LiH4Lij4Lit4LiH!5e0!3m2!1sth!2sth!4v1700000000000!5m2!1sth!2sth" class="w-full h-full border-0" allowfullscreen="" loading="lazy"></iframe>
                </div>
            </div>

            <div class="text-center mt-6">
                <a href="index.html" class="inline-flex items-center px-6 py-3 bg-gray-200 hover:bg-gray-300 text-gray-800 rounded-xl font-medium transition-colors">
                    <i class="fa-solid fa-arrow-left mr-2"></i> ย้อนกลับไปหน้าหลัก
                </a>
            </div>
        </div>
    </main>

    <div id="imageModal" class="fixed inset-0 bg-black/80 hidden z-50 items-center justify-center p-4" onclick="closeModal()">
        <img id="modalImg" class="max-w-full max-h-[90vh] rounded-lg shadow-2xl">
    </div>

    <script>
        function openModal(src) {
            document.getElementById('modalImg').src = src;
            document.getElementById('imageModal').classList.remove('hidden');
            document.getElementById('imageModal').classList.add('flex');
        }
        function closeModal() {
            document.getElementById('imageModal').classList.add('hidden');
            document.getElementById('imageModal').classList.remove('flex');
        }
    </script>
</body>
</html>
